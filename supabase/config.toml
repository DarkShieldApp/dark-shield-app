#:schema https://supabase.com/schemas/config/v1.json
# Local isolated development only; this does not link or configure a remote project.
project_id = "darkshield"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Aligned with the shared development project (PostgreSQL 17).
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/login?emailConfirmed=1"]
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = true

[local_smtp]
enabled = true
port = 54324

[realtime]
enabled = false

[storage]
# HU-06/T4: evidences live in the private report-evidences bucket (created by a
# migration); the local stack needs Storage to run its pgTAP tests and the API.
enabled = true
file_size_limit = "10MiB"

[edge_runtime]
enabled = false

[analytics]
enabled = false
